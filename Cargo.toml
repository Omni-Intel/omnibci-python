[package]
name = "omnibci-python"
version = "0.2.0"
edition = "2024"
publish = false
description = "Python bindings for the OmniBCI Rust device SDK"
repository = "https://github.com/Omni-Intel/omnibci-python"
license = "BSD-3-Clause"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
omnibci-sdk = { path = "sdk", version = "0.2.0", features = ["esp32", "e73-ble", "trigger-controller"] }
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
